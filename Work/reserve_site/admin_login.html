<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>管理者ログイン</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/components/login.css" />
  <link rel="stylesheet" href="css/pages/admin_login.css">
</head>
<body>
  <div class="login-box">
    <h2>管理者ログイン</h2>
    <form id="admin-login-form" novalidate>
      <input type="text" id="admin-id" placeholder="管理者ID" required />
      <input type="password" id="admin-pass" placeholder="パスワード" required />
      <div class="actions">
        <button id="login-btn" type="submit">ログイン</button>
        <button id="back-btn" type="button">カレンダーに戻る</button>
      </div>
    </form>
    <p id="error-message" aria-live="polite"></p>
  </div>

  <script type="module" src="js/pages/admin_login.js"></script>
</body>
</html>
