<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ログイン</title>
  <link rel="stylesheet" href="css/components/login.css" />
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="login-box">
    <h2>ログイン画面</h2>
    <form id="login-form" novalidate>
      <input type="text" id="username" placeholder="ユーザーID" autocomplete="username" required />
      <input type="password" id="password" placeholder="パスワード" autocomplete="current-password" required />
      <button id="login-btn" type="submit">ログイン</button>
    </form>
    <p id="error-message" aria-live="polite"></p>
  </div>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
