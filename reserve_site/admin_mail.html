<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メールアドレス管理</title>

  <!-- 外部CSS -->
  <link rel="stylesheet" href="css/pages/admin_mail.css">

  <!-- 管理者ログインチェック -->
  <script>
    (function() {
      const role = sessionStorage.getItem('role');
      const logged = sessionStorage.getItem('loggedIn');
      if (role !== 'admin' || logged !== 'true') {
        location.replace('admin_login.html');
      }
    })();
  </script>
</head>

<body>
  <h1>メールアドレス登録管理</h1>

  <label for="name">名前：</label>
  <input type="text" id="name" placeholder="例：田中太郎">

  <label for="email">メールアドレス：</label>
  <input type="email" id="email" placeholder="例：staff@example.com">

  <button id="add-btn" class="btn">登録</button>
  <p id="status"></p>

  <h2>登録一覧</h2>
  <table id="staff-table">
    <thead>
      <tr><th>名前</th><th>メールアドレス</th><th>操作</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="page-actions">
    <button class="btn btn-secondary" onclick="location.href='admin_dashboard.html'">管理画面に戻る</button>
  </div>

  <script type="module" src="js/pages/admin_mail.js"></script>
</body>
</html>
